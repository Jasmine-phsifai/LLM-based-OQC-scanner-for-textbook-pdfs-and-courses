[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ocrllm"
dynamic = ["version"]
description = "Importable OCRLLM library for board and image recognition."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "OCRLLM maintainers" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "hatchling>=1.25",
    "openai>=2.30,<3",
    "google-genai>=2.9,<3",
    "Pillow>=10.4,<13",
    "pypdfium2>=5.11.0,<5.12",
    "miniaudio>=1.71,<2",
    "imageio-ffmpeg>=0.6,<0.7",
    "opencv-python>=4.13,<4.14",
    "pytest>=8.0",
]
image = ["Pillow>=10.4,<13"]
audio = ["miniaudio>=1.71,<2"]
video = [
    "imageio-ffmpeg>=0.6,<0.7",
    "opencv-python>=4.13,<4.14",
]
dashscope = ["openai>=2.30,<3"]
google = ["google-genai>=2.9,<3"]
pdf-vision = [
    "pypdfium2>=5.11.0,<5.12",
    "Pillow>=10.4,<13",
]
ocr = [
    "Pillow>=10.4,<13",
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.23,<2",
]

[tool.hatch.version]
path = "src/ocrllm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ocrllm"]

[tool.hatch.build.targets.sdist]
include = [
    "/pyproject.toml",
    "/README.md",
    "/src/ocrllm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
